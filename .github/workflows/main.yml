name: Deploy Production Env

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build

      - name: Deploy to Nginx folder
        run: |
          sudo rm -rf /var/www/react-app/dist/*
          sudo cp -r dist/* /var/www/react-app/dist/
